name: Build & Release Android APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Semantic Versioning Format
        id: version_check
        run: |
          # Determine tag name from release event or git ref
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          echo "Processing version tag: $TAG_NAME"

          # Strict SemVer Regex: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE
          SEMVER_REGEX="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$"

          if [[ ! "$TAG_NAME" =~ $SEMVER_REGEX ]]; then
            echo "::error title=Invalid Version Format::Version '$TAG_NAME' does NOT follow the required Semantic Versioning format!"
            echo "==========================================================="
            echo "❌ REJECTED: '$TAG_NAME' is not a valid SemVer tag."
            echo ""
            echo "Allowed Formats:"
            echo "  • Stable Releases:  v1.0.0, v2.1.3, v0.5.0"
            echo "  • Pre-releases:     v1.0.0-alpha.1, v1.0.0-beta.2, v2.0.0-rc.1"
            echo ""
            echo "Refer to VERSIONING.md for details."
            echo "==========================================================="
            exit 1
          fi

          echo "✅ Valid SemVer format: $TAG_NAME"
          echo "VERSION_TAG=$TAG_NAME" >> $GITHUB_ENV

          # Check if this is a pre-release
          if [[ "$TAG_NAME" == *"-"* ]] || [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "📦 Build Type: Pre-release"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "🚀 Build Type: Stable Production Release"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Prepare APK Output
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PennyWise.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/PennyWise-${{ env.VERSION_TAG }}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PennyWise-APK
          path: release-assets/PennyWise.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PennyWise.apk
            release-assets/PennyWise-${{ env.VERSION_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Vercel PWA Deployment (Stable Releases Only)
        if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && env.IS_PRERELEASE == 'false' && env.VERCEL_HOOK != ''
        run: |
          echo "🚀 Stable release detected ($VERSION_TAG). Triggering Vercel Deploy Hook..."
          curl -s -X POST "$VERCEL_HOOK"
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
